openapi: 3.0.3
info:
  title: Backend Bank API
  version: 1.0.0
  description: |
    Plantilla base del contrato OpenAPI para la prueba tecnica.
    Este archivo se puede evolucionar endpoint por endpoint conforme avances en la implementacion.
servers:
  - url: http://localhost:8080
    description: Local
  - url: http://{host}:{port}
    description: Entorno configurable
    variables:
      host:
        default: localhost
      port:
        default: "8080"
tags:
  - name: Clientes
  - name: Cuentas
  - name: Movimientos
  - name: Reportes
security:
  - basicAuth: []
paths:
  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      operationId: listarClientes
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClienteResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Clientes]
      summary: Crear cliente
      operationId: crearCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteCreateRequest"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /clientes/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Clientes]
      summary: Obtener cliente por id
      operationId: obtenerClientePorId
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Clientes]
      summary: Reemplazar cliente
      operationId: reemplazarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteUpdateRequest"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Clientes]
      summary: Actualizar parcialmente cliente
      operationId: actualizarParcialCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientePatchRequest"
      responses:
        "200":
          description: Cliente actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Clientes]
      summary: Eliminar cliente
      operationId: eliminarCliente
      responses:
        "204":
          description: Cliente eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  /cuentas:
    get:
      tags: [Cuentas]
      summary: Listar cuentas
      operationId: listarCuentas
      responses:
        "200":
          description: Lista de cuentas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CuentaResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Cuentas]
      summary: Crear cuenta
      operationId: crearCuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuentaCreateRequest"
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /cuentas/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Cuentas]
      summary: Obtener cuenta por id
      operationId: obtenerCuentaPorId
      responses:
        "200":
          description: Cuenta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cuentas]
      summary: Reemplazar cuenta
      operationId: reemplazarCuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuentaUpdateRequest"
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Cuentas]
      summary: Actualizar parcialmente cuenta
      operationId: actualizarParcialCuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuentaPatchRequest"
      responses:
        "200":
          description: Cuenta actualizada parcialmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Cuentas]
      summary: Eliminar cuenta
      operationId: eliminarCuenta
      responses:
        "204":
          description: Cuenta eliminada
        "404":
          $ref: "#/components/responses/NotFound"

  /movimientos:
    get:
      tags: [Movimientos]
      summary: Listar movimientos
      operationId: listarMovimientos
      responses:
        "200":
          description: Lista de movimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimientoResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Movimientos]
      summary: Registrar movimiento
      operationId: crearMovimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimientoCreateRequest"
      responses:
        "201":
          description: Movimiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleError"

  /movimientos/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Movimientos]
      summary: Obtener movimiento por id
      operationId: obtenerMovimientoPorId
      responses:
        "200":
          description: Movimiento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Movimientos]
      summary: Eliminar movimiento
      operationId: eliminarMovimiento
      responses:
        "204":
          description: Movimiento eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  /reportes:
    get:
      tags: [Reportes]
      summary: Generar reporte por cliente y rango de fechas
      operationId: generarReporte
      parameters:
        - name: clienteId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: fechaDesde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: formato
          in: query
          required: false
          schema:
            type: string
            enum: [json, pdf]
            default: json
      responses:
        "200":
          description: Reporte generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Conflict:
      description: Conflicto de negocio o datos duplicados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    BusinessRuleError:
      description: Regla de negocio no cumplida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    InternalError:
      description: Error interno no controlado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"

  schemas:
    ErrorModel:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-04-25T12:45:08Z"
        status:
          type: integer
          example: 422
        code:
          type: string
          example: "BBB0005"
        title:
          type: string
          example: "INSUFFICIENT_FUNDS"
        instance:
          type: string
          example: "BBB0005"
        message:
          type: string
          example: "Saldo no disponible"
        detail:
          type: string
          example: "Saldo no disponible"
        type:
          type: string
          example: "Unprocessable Content"
        path:
          type: string
          example: "/movimientos"
        traceId:
          type: string
          example: "b1f09f6d-6f55-4be8-a7b4-44c13b0cfc77"
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorItem"
      required: [timestamp, status, code, title, message, path]

    FieldErrorItem:
      type: object
      properties:
        field:
          type: string
          example: "numeroCuenta"
        message:
          type: string
          example: "must not be blank"
      required: [field, message]

    PersonaBase:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 120
        genero:
          type: string
          maxLength: 20
        edad:
          type: integer
          minimum: 0
        identificacion:
          type: string
          maxLength: 50
        direccion:
          type: string
          maxLength: 180
        telefono:
          type: string
          maxLength: 30

    ClienteCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PersonaBase"
        - type: object
          properties:
            contrasena:
              type: string
              minLength: 8
            estado:
              type: boolean
              default: true
          required: [nombre, genero, edad, identificacion, direccion, telefono, contrasena]

    ClienteUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ClienteCreateRequest"

    ClientePatchRequest:
      type: object
      properties:
        nombre:
          type: string
        genero:
          type: string
        edad:
          type: integer
        identificacion:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        contrasena:
          type: string
        estado:
          type: boolean

    ClienteResponse:
      allOf:
        - $ref: "#/components/schemas/PersonaBase"
        - type: object
          properties:
            id:
              type: integer
              format: int64
            estado:
              type: boolean
          required: [id, nombre, genero, edad, identificacion, direccion, telefono, estado]

    CuentaCreateRequest:
      type: object
      properties:
        clienteId:
          type: integer
          format: int64
        numeroCuenta:
          type: string
          maxLength: 30
        tipoCuenta:
          type: string
          example: "AHORROS"
        saldoInicial:
          type: number
          format: double
          minimum: 0
        estado:
          type: boolean
          default: true
      required: [clienteId, numeroCuenta, tipoCuenta, saldoInicial]

    CuentaUpdateRequest:
      $ref: "#/components/schemas/CuentaCreateRequest"

    CuentaPatchRequest:
      type: object
      properties:
        numeroCuenta:
          type: string
        tipoCuenta:
          type: string
        estado:
          type: boolean

    CuentaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        numeroCuenta:
          type: string
        tipoCuenta:
          type: string
        saldoInicial:
          type: number
          format: double
        estado:
          type: boolean
      required: [id, clienteId, numeroCuenta, tipoCuenta, saldoInicial, estado]

    MovimientoCreateRequest:
      type: object
      properties:
        cuentaId:
          type: integer
          format: int64
        tipoMovimiento:
          type: string
          description: CREDIT o DEBIT
          enum: [CREDIT, DEBIT]
        valor:
          type: number
          format: double
      required: [cuentaId, tipoMovimiento, valor]

    MovimientoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cuentaId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
        tipoMovimiento:
          type: string
        valor:
          type: number
          format: double
        saldo:
          type: number
          format: double
      required: [id, cuentaId, fecha, tipoMovimiento, valor, saldo]

    ReporteItem:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        cliente:
          type: string
        numeroCuenta:
          type: string
        tipo:
          type: string
        saldoInicial:
          type: number
          format: double
        estado:
          type: boolean
        movimiento:
          type: number
          format: double
        saldoDisponible:
          type: number
          format: double

    ReporteResumen:
      type: object
      properties:
        totalDebitos:
          type: number
          format: double
        totalCreditos:
          type: number
          format: double

    ReporteResponse:
      type: object
      properties:
        clienteId:
          type: integer
          format: int64
        fechaDesde:
          type: string
          format: date
        fechaHasta:
          type: string
          format: date
        resumen:
          $ref: "#/components/schemas/ReporteResumen"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReporteItem"
        pdfBase64:
          type: string
          nullable: true

